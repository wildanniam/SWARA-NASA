[project]
name = "skychange"
version = "0.1.0"
description = "SPHEREx sky position -> aligned blink frames and spectrum bundle"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=6.1",
    "numpy>=2.0",
    "pillow>=10.4",
    "httpx>=0.27",
    "fsspec>=2026.9.0",
    "aiohttp>=3.14.5",
    "fastapi>=0.162.6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Hanya untuk `skychange allsky` (dijalankan sekali, di mesin sendiri); API tidak membutuhkannya.
sky = ["astropy-healpix>=1.0"]

[project.scripts]
skychange = "skychange.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skychange"]
